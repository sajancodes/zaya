version: '3.8'

services:
  zaya-web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: zaya-distribution-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/zaya_analytics.db
      - ADMIN_USER=owner
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be configured with a strong password (minimum 12 characters)}
      - ZAYA_WEBSITE_URL=https://zaya.sajan.codes
    volumes:
      - zaya_web_data:/app/data

volumes:
  zaya_web_data:
