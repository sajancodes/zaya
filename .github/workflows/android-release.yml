name: Android app releases
on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'tools/prepare_android_release.py'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-app-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Choose a version newer than the public release
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          url = 'https://github.com/sajancodes/zaya-companion-releases/releases/latest/download/update.json'
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  previous = json.load(response)['version_code']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              previous = 0
          code = max(10001, int(previous) + 1)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ZAYA_VERSION_CODE={code}\nZAYA_VERSION_NAME=0.4.{code - 10000}\n')
      - name: Restore the existing app signing identity
        env:
          SIGNING_KEY: ${{ secrets.ZAYA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/zaya-signing.jks"
          echo "ZAYA_SIGNING_STORE=$RUNNER_TEMP/zaya-signing.jks" >> "$GITHUB_ENV"
      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check and build the signed app
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:lintRelease --console=plain --max-workers=2
          ./gradlew :app:assembleRelease --console=plain --max-workers=2
      - name: Prepare only APK and update metadata
        run: >-
          python tools/prepare_android_release.py
          --apk mobile/android/app/build/outputs/apk/release/app-release.apk
          --metadata mobile/android/app/build/outputs/apk/release/output-metadata.json
          --output dist/android-release
      - name: Publish APK-only public release
        env:
          GH_TOKEN: ${{ secrets.ZAYA_RELEASE_TOKEN }}
        run: |
          gh release create "android-$ZAYA_VERSION_NAME" --repo sajancodes/zaya-companion-releases \
            --title "Zaya Companion $ZAYA_VERSION_NAME" --notes-file dist/android-release/notes.md --latest \
            dist/android-release/Zaya-Companion.apk dist/android-release/update.json
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/zaya-signing.jks"
