name: Zaya code checks
on:
  workflow_call:
  push:
    branches: [zaya-updates, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: zaya-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r web/requirements.txt ruff pytest httpx pip-audit
      - name: Check syntax and undefined names
        run: python -m ruff check --isolated --select E9,F63,F7,F82 core actions services memory main.py ui.py dashboard plugins tools
      - name: Compile application sources
        run: python -m compileall -q core actions services memory dashboard plugins tools main.py ui.py
      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --disable-warnings
      - name: Audit release dependencies
        run: python -m pip_audit -r requirements.txt
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
