name: Production Distribution Release

on:
  push:
    tags:
      - 'v*'
      - 'android-*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to release (all, windows, android)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - android
      channel:
        description: 'Release channel (stable, beta)'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: read

concurrency:
  group: zaya-production-release
  cancel-in-progress: false

jobs:
  version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.ver.outputs.version_code }}
      version_name: ${{ steps.ver.outputs.version_name }}
      release_tag: ${{ steps.ver.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculate next version from public releases
        id: ver
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          url = 'https://github.com/sajancodes/zaya-companion-releases/releases/latest/download/update.json'
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  previous = json.load(response).get('version_code', 0)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  previous = 0
              else:
                  raise RuntimeError(f"Failed to query public releases: HTTP {error.code}") from error
          except Exception as error:
              raise RuntimeError(f"Network error verifying release version: {error}") from error
          code = max(10001, int(previous) + 1)
          name = f"0.5.{code - 10000}"
          tag = f"v{name}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version_code={code}\n")
              f.write(f"version_name={name}\n")
              f.write(f"release_tag={tag}\n")

  build_windows:
    name: Build Windows Application
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [version]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build spatial renderer frontend
        shell: powershell
        working-directory: spatial_renderer
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - name: Generate version.json for build
        shell: powershell
        run: |
          python -c "from core.version import write_version_file; write_version_file('version.json', '${{ needs.version.outputs.version_name }}', int('${{ needs.version.outputs.version_code }}'), '${{ github.event.inputs.channel || 'stable' }}')"

      - name: Package Zaya desktop application with PyInstaller
        shell: powershell
        env:
          ZAYA_VERSION: ${{ needs.version.outputs.version_name }}
          ZAYA_BUILD: ${{ needs.version.outputs.version_code }}
          ZAYA_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
        run: |
          python -m PyInstaller packaging/windows/zaya-hand-worker.spec --noconfirm --distpath dist/windows/worker
          python -m PyInstaller packaging/windows/zaya.spec --noconfirm --distpath dist/windows
          Copy-Item dist/windows/worker/ZayaHandWorker.exe dist/windows/Zaya/ -Force

      - name: Compile Inno Setup installer and generate desktop-update.json
        shell: powershell
        run: |
          python tools/prepare_windows_release.py `
            --app-dir dist/windows/Zaya `
            --output dist/windows `
            --version ${{ needs.version.outputs.version_name }} `
            --build ${{ needs.version.outputs.version_code }} `
            --channel ${{ github.event.inputs.channel || 'stable' }} `
            --tag ${{ needs.version.outputs.release_tag }}

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/windows/ZayaSetup.exe
            dist/windows/Zaya-Setup.exe
            dist/windows/desktop-update.json
            setup.txt

  build_android:
    name: Build Android Companion & App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [version]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Android signing identity
        env:
          SIGNING_KEY: ${{ secrets.ZAYA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/zaya-signing.jks"
          echo "ZAYA_SIGNING_STORE=$RUNNER_TEMP/zaya-signing.jks" >> "$GITHUB_ENV"

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK and App Bundle (AAB)
        working-directory: mobile/android
        env:
          ZAYA_VERSION_CODE: ${{ needs.version.outputs.version_code }}
          ZAYA_VERSION_NAME: ${{ needs.version.outputs.version_name }}
          ZAYA_STORE_PASSWORD: ${{ secrets.ZAYA_STORE_PASSWORD }}
          ZAYA_KEY_ALIAS: ${{ secrets.ZAYA_KEY_ALIAS }}
          ZAYA_KEY_PASSWORD: ${{ secrets.ZAYA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:lintRelease --console=plain --max-workers=2
          ./gradlew :app:assembleRelease --console=plain --max-workers=2
          ./gradlew :app:bundleRelease --console=plain --max-workers=2

      - name: Prepare Android release assets
        run: |
          python tools/prepare_android_release.py \
            --apk mobile/android/app/build/outputs/apk/release/app-release.apk \
            --metadata mobile/android/app/build/outputs/apk/release/output-metadata.json \
            --aab mobile/android/app/build/outputs/bundle/release/app-release.aab \
            --output dist/android-release

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/zaya-signing.jks"

      - name: Upload Android public release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            dist/android-release/Zaya-Companion.apk
            dist/android-release/update.json
            dist/android-release/notes.md

      - name: Upload Google Play App Bundle (CI Artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: Zaya-Companion-aab
          path: dist/android-release/Zaya-Companion.aab

  publish:
    name: Aggregate & Publish Release
    runs-on: ubuntu-latest
    needs: [version, build_windows, build_android]
    if: |
      always() &&
      (
        ((github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all') &&
         needs.build_windows.result == 'success' && needs.build_android.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'windows' &&
         needs.build_windows.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'android' &&
         needs.build_android.result == 'success')
      )
    steps:
      - uses: actions/checkout@v4

      - name: Create release staging directory
        run: mkdir -p dist/release

      - name: Download Windows artifacts
        if: needs.build_windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/release

      - name: Download Android artifacts
        if: needs.build_android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist/release

      - name: Copy setup.txt into release directory
        run: |
          if [ -f setup.txt ]; then cp setup.txt dist/release/; fi

      - name: Compute SHA256SUMS.txt
        shell: python
        run: |
          import hashlib, os
          release_dir = 'dist/release'
          hashes = []
          for fname in sorted(os.listdir(release_dir)):
              if fname in ('SHA256SUMS.txt', 'notes.md', 'unified-notes.md', 'Zaya-Companion.aab'):
                  continue
              fpath = os.path.join(release_dir, fname)
              if os.path.isfile(fpath):
                  with open(fpath, 'rb') as f:
                      digest = hashlib.sha256(f.read()).hexdigest()
                  hashes.append(f"{digest}  {fname}\n")
          with open(os.path.join(release_dir, 'SHA256SUMS.txt'), 'w', encoding='utf-8') as out:
              out.writelines(hashes)
          print("SHA256SUMS.txt generated:")
          for h in hashes:
              print(h.strip())

      - name: Prepare release notes
        run: |
          tag="${{ needs.version.outputs.release_tag }}"
          cat <<EOF > dist/release/unified-notes.md
          # Zaya Production Release ($tag)

          Unified production distribution for Windows desktop and Android Zaya Companion.

          ### Windows Desktop
          - Installer: \`ZayaSetup.exe\` (mirror: \`Zaya-Setup.exe\`)
          - User guide: \`setup.txt\`
          - Update manifest: \`desktop-update.json\`

          ### Android Companion
          - Package: \`Zaya-Companion.apk\`
          - Update manifest: \`update.json\`

          ### Integrity & Verification
          All release assets are published with SHA-256 digests in \`SHA256SUMS.txt\`.
          EOF
          if [ -f dist/release/notes.md ]; then
              cat dist/release/notes.md >> dist/release/unified-notes.md
          fi

      - name: Publish to sajancodes/zaya-companion-releases
        env:
          GH_TOKEN: ${{ secrets.ZAYA_RELEASE_TOKEN }}
        run: |
          tag="${{ needs.version.outputs.release_tag }}"
          channel="${{ github.event.inputs.channel || 'stable' }}"
          echo "Publishing release $tag to sajancodes/zaya-companion-releases (channel: $channel)..."
          cd dist/release
          assets=()
          for f in ZayaSetup.exe Zaya-Setup.exe Zaya-Companion.apk desktop-update.json update.json setup.txt SHA256SUMS.txt; do
              if [ -f "$f" ]; then
                  assets+=("$f")
              fi
          done

          # Only mark as latest if stable channel AND both Windows & Android are present
          if [ "$channel" = "beta" ]; then
              FLAG="--prerelease"
          elif [ -f "ZayaSetup.exe" ] && [ -f "Zaya-Companion.apk" ]; then
              FLAG="--latest"
          else
              FLAG="--latest=false"
          fi

          gh release create "$tag" \
            --repo sajancodes/zaya-companion-releases \
            --title "Zaya $tag" \
            --notes-file unified-notes.md \
            $FLAG \
            "${assets[@]}"
